<!doctype html><html><head><meta charset="utf-8"><title>Fixture: endless feed</title>
<style>
body{font:16px system-ui;margin:0;background:#eef2f7}
.item{height:260px;margin:12px auto;max-width:640px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:16px;box-sizing:border-box}
</style></head><body><div id="feed"></div>
<script>
// An infinite feed: more items are appended whenever the bottom is reached, so the capture
// keeps probing for growth at the end of the page (until the height limit).
let n = 0, pending = false;
window.__grows = 0;
function add(k) { for (let i = 0; i < k; i++) { const d = document.createElement('div'); d.className = 'item'; d.textContent = 'Feed item ' + (++n); feed.appendChild(d); } }
add(8);
addEventListener('scroll', () => {
  if (pending || innerHeight + scrollY < document.documentElement.scrollHeight - 50) return;
  pending = true;
  setTimeout(() => { add(4); window.__grows++; pending = false; }, 150);
});
</script></body></html>
